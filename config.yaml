# config.yaml
# Central Configuration for Fraud Detection DAG

paths:
  # Input and Intermediate files
  raw_data: "creditcard.csv"
  preprocessed_data: "preprocessed_data.csv"
  X_train: "X_train.csv"
  X_test: "X_test.csv"
  y_train: "y_train.csv"
  y_test: "y_test.csv"
  resampled_train: "resampled_train_data_no_ohe.csv"
  feature_engineered_test: "feature_engineered_test_data_no_ohe.csv"

  # Artifacts and Models
  promising_features: "promising_features.pkl"
  discretization_info: "discretization_info.pkl"
  learned_dag_edges: "learned_dag_edges.txt"
  bayesian_network_model: "bayesian_network_model.pkl"
  xgboost_model: "xgboost_model.pkl"

  # Output Reports and Figures
  causal_inference_results: "causal_inference_results.csv"
  figures_dir: "Figures"
  xgboost_pr_curve: "Figures/xgboost_pr_curve.png"
  xgboost_shap_importance: "Figures/xgboost_shap_importance.png"
  calibration_uncalibrated: "Figures/calibration_uncalibrated.png"
  calibration_platt: "Figures/calibration_platt_scaling.png"
  calibration_isotonic: "Figures/calibration_isotonic.png"
  interactive_shap: "Figures/interactive_shap.html"

pipeline:
  random_state: 42
  test_size: 0.2

preprocessing:
  features_to_scale:
    - V1
    - V2
    - V3
    - V4
    - V5
    - V6
    - V7
    - V8
    - V9
    - V10
    - V11
    - V12
    - V13
    - V14
    - V15
    - V16
    - V17
    - V18
    - V19
    - V20
    - V21
    - V22
    - V23
    - V24
    - V25
    - V26
    - V27
    - V28
    - Time
    - Amount

feature_engineering:
  num_bins: 5
  interaction_parents_candidates:
    - V1_disc
    - V7_disc
    - V12_disc
    - V14_disc
    - Time_disc
  p_value_threshold: 0.05
  mutual_information_threshold: 0.001
  smote_k_neighbors: 5
  correlation_threshold: 0.4
  max_unique_cardinality: 50

dag_learning:
  max_iter: 500
  tabu_length: 10 # Introduce Tabu Search memory
  bdeu_equivalent_sample_size: 10 # Parameter for Bayesian Estimator

xgboost:
  objective: "binary:logistic"
  eval_metric: "aucpr"
  key_causal_features: # Must match exact generated feature names
    - V4_disc
    - V16_disc
    - V14_disc_V12_disc_interaction
